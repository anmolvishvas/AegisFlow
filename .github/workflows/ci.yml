name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Code Style (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Formatter Check
        run: ruff format --check .

  type-check:
    name: Strict Type Check (Mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Typing Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy types-setuptools
          if [ -f pyproject.toml ]; then pip install -e .; fi

      - name: Run Mypy in Strict Mode
        run: |
          if [ -d "src" ]; then
            mypy --strict src
          else
            echo "No src directory found yet, skipping strict mypy check."
          fi

  test:
    name: Test Matrix (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies & Test Harness
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov hypothesis httpx
          if [ -f pyproject.toml ]; then pip install -e ".[dev]"; fi


      - name: Run Pytest with Coverage
        run: |
          if [ -d "tests" ]; then
            pytest tests/ --cov=src --cov-report=xml --cov-report=term-missing
          else
            echo "No tests directory found yet, skipping pytest execution."
          fi

      - name: Upload Coverage to Codecov (Python 3.12 only)
        if: matrix.python-version == '3.12' && hashFiles('coverage.xml') != ''
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  security-audit:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Security Auditing Tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit

      - name: Audit Python Dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt
          elif [ -f pyproject.toml ]; then
            pip-audit
          else
            echo "No requirements or pyproject found to audit, skipping."
          fi

      - name: Static Security Analysis with Bandit
        run: |
          if [ -d "src" ]; then
            bandit -r src -ll
          else
            echo "No src directory found yet, skipping bandit scan."
          fi
